<!doctype html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Strategic Portfolio Management</title>
  <link rel="stylesheet" href="/govuk.css">
  <script src="/login.js" defer></script>
</head>
<body class="govuk-template__body">
  <a class="govuk-skip-link" href="#main-content">Skip to main content</a>
  <header class="govuk-header govuk-header--full-width-border" role="banner">
    <div class="govuk-header__container govuk-width-container"><div class="govuk-header__content">
      <a href="/" class="govuk-header__link govuk-header__service-name">Strategic Portfolio Management</a>
    </div></div>
  </header>
  <div class="govuk-width-container">
    <div class="govuk-phase-banner"><p class="govuk-phase-banner__content"><strong class="govuk-tag govuk-phase-banner__content__tag">Prototype</strong><span class="govuk-phase-banner__text">Use a provisioned pilot account.</span></p></div>
    <main class="govuk-main-wrapper" id="main-content">
      <div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-xl">Sign in</h1>
        <div id="login-error" aria-live="polite"></div>
        <form id="login-form">
          <div class="govuk-form-group"><label class="govuk-label" for="username">Username</label><input class="govuk-input" id="username" name="username" autocomplete="username" required></div>
          <div class="govuk-form-group"><label class="govuk-label" for="password">Password</label><input class="govuk-input" id="password" name="password" type="password" autocomplete="current-password" required></div>
          <button class="govuk-button" type="submit">Sign in</button>
        </form>
      </div></div>
    </main>
  </div>
  <footer class="govuk-footer" role="contentinfo"><div class="govuk-width-container"><p class="govuk-body-s">Strategic Portfolio Management local prototype</p></div></footer>
</body>
</html>
