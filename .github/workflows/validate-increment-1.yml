name: Validate increment 1 application

on:
  push:
    paths:
      - 'app/**'
      - 'reconciled-core/migrations/**'
      - '.github/workflows/validate-increment-1.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'reconciled-core/migrations/**'
      - '.github/workflows/validate-increment-1.yml'

jobs:
  app-postgres-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spm_increment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spm_increment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: spm_increment_test
      SPM_TEST_DATABASE_URL: postgresql://spm_ci:ci-only-password@localhost:5432/spm_increment_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and synthetic seed
        run: |
          for file in reconciled-core/migrations/V*.sql; do
            psql -v ON_ERROR_STOP=1 -1 -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -1 -f app/test/seed.sql
      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        working-directory: app
        run: pnpm test

